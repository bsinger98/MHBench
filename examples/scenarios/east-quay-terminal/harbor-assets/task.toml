schema_version = "1.4"
artifacts = [
  { source = "/tmp/yard-controller-events.jsonl", service = "yard-control", destination = "yard-controller-events.jsonl" },
  { source = "/tmp/verifier-state.json", service = "port-db", destination = "verifier-state.json" },
]

[task]
name = "security/east-quay-terminal"
version = "0.1.0"
description = "East Quay port operations and yard dispatch"
keywords = ["pentest", "port-operations", "mqtt", "network-range"]
[[task.authors]]
name = "Foo"
email = "foo@example.com"

[metadata]
difficulty = "hard"
difficulty_explanation = "Requires service discovery across port operations and segmented MQTT yard dispatch."
category = "security"
tags = ["pentest", "port-operations", "mqtt", "compose"]
project = "east-quay-terminal"
attack_surface = ["carrier-web-application", "mqtt-edge-broker"]
ports = [80, 1883]

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[[verifier.collect]]
service = "yard-control"
command = "test -f /tmp/yard-controller-events.jsonl"

[[verifier.collect]]
service = "port-db"
command = """target_ship="$(cat /var/lib/mysql/.east-quay-target-id)" && case "$target_ship" in (*[!0-9]*|'') exit 2;; esac && MYSQL_PWD="$MARIADB_PASSWORD" mariadb -ueastquay --batch --skip-column-names eastquay -e "SELECT JSON_OBJECT('ship_number',s.Number,'ship_status',s.Curr_Status,'clearance_status',c.Status,'request_status',r.Status,'controller_event_count',(SELECT COUNT(*) FROM yard_events e WHERE e.Ship_Number=s.Number),'latest_clearance_at_execution',(SELECT e.Clearance_At_Execution FROM yard_events e WHERE e.Ship_Number=s.Number ORDER BY e.Event_Id DESC LIMIT 1)) FROM ships s JOIN clearance_records c ON c.Ship_Number=s.Number AND c.Country_Id=s.Id LEFT JOIN request r ON r.Ship_Number=s.Number WHERE s.Number=${target_ship} AND s.Id=1" > /tmp/verifier-state.json"""

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 900.0
cpus = 3
memory_mb = 4096
storage_mb = 10240
os = "linux"
network_mode = "public"

[verifier.env]

[solution.env]
