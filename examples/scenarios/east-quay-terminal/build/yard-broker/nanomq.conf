mqtt {
    max_topic_alias = 1024
    max_packet_size = 1MB
}
listeners.tcp {
    bind = "0.0.0.0:1883"
}
http_server {
    port = 8081
    limit_conn = 2
    username = broker-admin
    password = local-admin-only
}
log {
    to = [file, console]
    level = info
    dir = "/tmp"
    file = "nanomq.log"
}
auth {
    allow_anonymous = false
    no_match = deny
    deny_action = ignore
    http_auth = {
        auth_req {
            url = "http://yard-dispatch:8081/mqtt/auth"
            method = "POST"
            headers.content-type = "application/x-www-form-urlencoded"
            params = {clientid = "%c", username = "%u", password = "%P"}
        }
        acl_req {
            url = "http://yard-dispatch:8081/mqtt/acl"
            method = "POST"
            headers.content-type = "application/x-www-form-urlencoded"
            params = {clientid = "%c", username = "%u", access = "%A", ipaddr = "%a", topic = "%t", mountpoint = "%m"}
        }
        timeout = 5s
        connect_timeout = 3s
        pool_size = 8
        cache_ttl = 0s
    }
}
